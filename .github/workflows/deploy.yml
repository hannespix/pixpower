name: Validate & Deploy

on:
  pull_request:
  push:
    branches: [main]
  # Manuell nachtriggerbar — GitHub Pages antwortet gelegentlich mit 503
  # ("no server available"), dann genuegt ein Neustart ohne neuen Commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Validate data & build
        working-directory: app
        env:
          # Repository-Secret setzen -> data.json wird AES-verschluesselt ausgeliefert.
          # Ohne Secret wird im Klartext gebaut (Demo-Betrieb).
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # Pages liefert sporadisch HTTP 503 zurueck; ein zweiter Versuch nach
      # kurzer Pause reicht dann meist. Schlaegt auch der fehl, faellt der
      # Job rot aus (kein stilles Durchwinken).
      - name: Retry deploy after transient failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (2. Versuch)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
